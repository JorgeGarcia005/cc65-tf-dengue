# Bases de datos del sistema (ADR-0006): MongoDB persistente y Redis como caché.
#
#   docker compose -f deploy/docker-compose.bd.yml up -d --wait
#   go test -race -tags integracion ./internal/almacen/...
#
# Los puertos se publican solo en 127.0.0.1 (para los tests y la evidencia desde
# el anfitrión). Cuando entre el Compose del clúster (#27) se incluye desde
# deploy/docker-compose.yml y el coordinador los usa por la red interna.
name: cc65-tf-bd

services:
  mongo:
    image: mongo:7.0.14
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-datos:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1
    # Solo caché: sin persistencia en disco y con desalojo LRU si se llena.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo-datos: {}
