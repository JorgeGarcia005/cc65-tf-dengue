# Clúster de entrenamiento: un coordinador (parameter server), N nodos de ML,
# MongoDB y Redis.
#
#   go run ./cmd/gold -shards 3                      # una vez: gold y shards en data/gold
#   docker compose -f deploy/docker-compose.yml up --build --exit-code-from coordinator
#
# Variables (todas opcionales; ver deploy/README.md):
#   NODOS      nodos de ML que se levantan y que el coordinador espera   (3)
#   EPOCAS     épocas de entrenamiento                                   (600)
#   TASA       tasa de aprendizaje                                       (2)
#   LAMBDA     regularización L2                                         (0.0001)
#   VERIFICAR  repite en secuencial y exige pesos idénticos bit a bit    (false)
#   PROGRESO   registra la pérdida cada tantas épocas                    (50)
#   WORKERS    goroutines del worker pool de cada nodo; 0 = núcleos      (0)
#   GOLD       carpeta del anfitrión con shard_<s>.bin                   (../data/gold)
#   USUARIO    uid:gid del coordinador, que escribe en ../reports        (65532:65532)
#   API        modo servicio: dirección de la API REST, p. ej. :8080     (vacío = entrena una vez y sale)
#   PUERTO_API puerto del anfitrión que publica la API (docker-compose.api.yml) (8080)
#
# Modo servicio (API con Swagger en http://localhost:8080/docs; entrena con
# POST /api/v1/entrenamientos y se detiene con `docker compose stop`). El
# archivo extra publica el puerto solo en este modo:
#   API=:8080 docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.api.yml up --build
name: cc65-tf

# informe:imagenes
x-imagen: &imagen
  image: cc65-tf
  build:
    context: ..
    dockerfile: deploy/Dockerfile

# Imagen de la Parte A (perfil «datos»): los tres servicios declaran cómo
# construirla, así `run --no-deps gold …` o `run --no-deps entrenar …` la
# construyen en un clon limpio en vez de buscarla en Docker Hub (PR-94 H1).
x-imagen-datos: &imagen-datos
  image: cc65-tf-datos
  build:
    context: ..
    dockerfile: deploy/Dockerfile.datos
# /informe:imagenes

services:
  # informe:coordinator
  coordinator:
    <<: *imagen
    user: "${USUARIO:-65532:65532}"
    command:
      - /usr/local/bin/coordinator
      - -escucha=:9000
      - -gold=/datos
      - -nodos=${NODOS:-3}
      - -epocas=${EPOCAS:-600}
      - -tasa=${TASA:-2}
      - -lambda=${LAMBDA:-0.0001}
      - -verificar=${VERIFICAR:-false}
      - -progreso=${PROGRESO:-50}
      - -timeout-registro=${TIMEOUT_REGISTRO:-120s}
      - -timeout-epoca=${TIMEOUT_EPOCA:-60s}
      - -salida=/reports/entrenamiento_cluster.json
      - -api=${API:-}
      - -modelo=/datos/modelo.json
    volumes:
      - ${GOLD:-../data/gold}:/datos:ro
      - ../reports:/reports
    expose:
      - "9000"
    networks: [cluster]
  # /informe:coordinator

  # informe:node
  node:
    <<: *imagen
    # Sin nombre de contenedor fijo: `--scale node=N` crea node-1 … node-N.
    command:
      - /usr/local/bin/node
      - -coordinador=coordinator:9000
      - -workers=${WORKERS:-0}
    volumes:
      - ${GOLD:-../data/gold}:/datos:ro
    depends_on: [coordinator]
    deploy:
      replicas: ${NODOS:-3}
    networks: [cluster]
  # /informe:node

  # Bases de datos del modo servicio (ADR-0006): MongoDB persistente y Redis
  # como caché de predicciones. Solo en la red interna; el coordinador las usa
  # cuando corre con docker-compose.api.yml.
  # informe:bases
  mongo:
    image: mongo:7.0.14
    volumes: [mongo-datos:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cluster]

  redis:
    image: redis:7.4.1
    # Solo caché: sin persistencia en disco y con desalojo LRU si se llena.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [cluster]
  # /informe:bases

  # ---- Parte A en Docker (perfil «datos», auditoría TB2 B1) ----------------
  # Del CSV bronze al gold y al modelo inicial, en contenedores y en orden:
  #   docker compose -f deploy/docker-compose.yml --profile datos up entrenar
  # Requiere data/bronze/vigilancia_dengue_2000_2025.csv (make data o descarga
  # manual, ver README). Escriben en ../data y ../reports del anfitrión con las
  # mismas rutas que `go run` (directorio de trabajo /trabajo). No usan la red.
  # informe:datos
  loader:
    <<: *imagen-datos
    profiles: [datos]
    user: "${USUARIO:-65532:65532}"
    command: ["/usr/local/bin/loader"]
    volumes:
      - ../data:/trabajo/data
      - ../reports:/trabajo/reports
    network_mode: none
  gold:
    <<: *imagen-datos
    profiles: [datos]
    user: "${USUARIO:-65532:65532}"
    command: ["/usr/local/bin/gold", "-shards=${NODOS:-3}"]
    volumes:
      - ../data:/trabajo/data
      - ../reports:/trabajo/reports
    network_mode: none
    depends_on:
      loader:
        condition: service_completed_successfully
  entrenar:
    <<: *imagen-datos
    profiles: [datos]
    user: "${USUARIO:-65532:65532}"
    command: ["/usr/local/bin/entrenar", "-epocas=${EPOCAS:-600}", "-tasa=${TASA:-2}", "-lambda=${LAMBDA:-0.0001}"]
    volumes:
      - ../data:/trabajo/data
      - ../reports:/trabajo/reports
    network_mode: none
    depends_on:
      gold:
        condition: service_completed_successfully
  # /informe:datos

volumes:
  mongo-datos: {}

networks:
  # Red interna: el puerto 9000 no se publica en el anfitrión.
  cluster: {}
