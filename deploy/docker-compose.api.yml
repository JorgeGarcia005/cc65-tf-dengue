# Modo servicio: publica la API del coordinador en el anfitrión. Se usa junto
# con docker-compose.yml y la variable API (ver ese archivo):
#   API=:8080 docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.api.yml up --build
# El modo de entrenamiento único no publica puertos, así que no choca con
# otro servicio que ya use el 8080 en la máquina.
services:
  coordinator:
    ports:
      - "${PUERTO_API:-8080}:8080"
