openapi: 3.0.3
info:
  title: API de riesgo de dengue con signos de alarma (CC65 TF)
  version: 1.0.0
  description: |
    API del coordinador del clúster (Parte C). Predice el riesgo de que un caso
    notificado de dengue sea **con signos de alarma o grave**, con la regresión
    logística entrenada de forma distribuida sobre los datos abiertos del
    MINSA / CDC Perú (2000-2025). También expone el modelo publicado, el estado
    del clúster y permite lanzar entrenamientos.

    Implementada solo con `net/http` de la biblioteca estándar de Go.

    **Seguridad (ADR-0007).** Las rutas `/api/v1/*`, salvo el login, exigen
    `Authorization: Bearer <jwt>`: sin token o con uno inválido, 401; con un
    rol sin acceso, 403. Analista: modelo, predicciones, riesgo y evaluación.
    Admin: además, clúster y entrenamientos. CORS solo para los orígenes de
    `CORS_ORIGENES`. Todo POST admite como máximo 64 KiB (413).
servers:
  - url: http://localhost:8080
    description: docker compose (deploy/docker-compose.yml)
tags:
  - name: prediccion
  - name: modelo
  - name: cluster
  - name: sistema
paths:
  /healthz:
    get:
      tags: [sistema]
      summary: Comprobación de vida
      operationId: salud
      responses:
        "200":
          description: El servidor atiende.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: {type: string, example: ok}
                  version_modelo: {type: string, example: 3f9a1c0b7d2e}
  /api/v1/auth/login:
    post:
      tags: [sistema]
      summary: Inicia sesión y devuelve un JWT (ADR-0007)
      description: |
        Credenciales del analista o del admin. El correo no distingue
        mayúsculas. Una clave errada y un correo inexistente reciben el mismo
        401. Tras 5 intentos fallidos en un minuto desde la misma IP, el
        siguiente recibe 429 con Retry-After. Sin JWT_SECRETO en el
        coordinador, 503.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Login"}
            example: {correo: analista@vigia.pe, clave: una-clave-larga}
      responses:
        "200":
          description: Token HS256 con 60 minutos de vida.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sesion"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429":
          description: Demasiados intentos fallidos desde esta IP.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda volver a intentar.
              schema: {type: integer}
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/modelo:
    get:
      tags: [modelo]
      summary: Modelo publicado (pesos por variable, umbral y versión)
      operationId: verModelo
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Modelo vigente.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Modelo"}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
  /api/v1/predicciones:
    post:
      tags: [prediccion]
      summary: Riesgo de dengue con signos de alarma o grave para un caso
      description: |
        Valida la consulta con las mismas reglas de limpieza del loader
        (semana 1–53, edad ≥ 0 y ≤ 110 años, tipo_edad A/M/D, sexo F/M) y la
        transforma con el esquema de variables del entrenamiento. Un
        departamento sin columna propia en el modelo se trata como OTROS.
      operationId: predecir
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Consulta"}
            example: {departamento: LORETO, ano: 2024, semana: 10, edad: 34, tipo_edad: A, sexo: M}
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Predicción.
          headers:
            X-Cache:
              description: "HIT si la respuesta salió de la caché (Redis), MISS si se calculó. Ausente sin caché."
              schema: {type: string, enum: [HIT, MISS]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Prediccion"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "413": {$ref: "#/components/responses/Error"}
  /api/v1/riesgo:
    get:
      tags: [modelo]
      summary: Riesgo cruzado por departamento, semana y grupo de edad (mapa)
      description: |
        Subconjunto de reports/evaluacion.json (cmd/evaluacion): el cubo de
        riesgo (casos, tasa observada, riesgo calibrado, casos esperados con
        signos de alarma, con niveles «todos») y las combinaciones
        prioritarias. Comprimido con gzip si el cliente lo acepta; ETag para
        revalidar (304).
      operationId: verRiesgo
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Riesgo cruzado.
          headers:
            ETag: {description: Huella del documento., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentoEvaluacion"}
        "304": {description: Sin cambios desde el ETag enviado.}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/evaluacion:
    get:
      tags: [modelo]
      summary: Evaluación experimental completa (reports/evaluacion.json)
      description: |
        Métricas en test, ROC, calibración por deciles con IC de Wilson,
        riesgo cruzado, prioridades, escalabilidad por número de nodos y
        latencia de la API, con el sha256 de cada fuente. Gzip y ETag como
        /api/v1/riesgo.
      operationId: verEvaluacion
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Evaluación.
          headers:
            ETag: {description: Huella del documento., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentoEvaluacion"}
        "304": {description: Sin cambios desde el ETag enviado.}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/cluster:
    get:
      tags: [cluster]
      summary: Estado del clúster (nodos, carga, época y pérdida)
      operationId: verCluster
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Estado actual del coordinador.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EstadoCluster"}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/entrenamientos:
    post:
      tags: [cluster]
      summary: Lanza un entrenamiento distribuido
      description: |
        Responde 202 de inmediato; el progreso se consulta en
        `GET /api/v1/entrenamientos/{id}`. Solo puede haber uno en curso. Al
        terminar bien, el modelo nuevo se publica y cambia `version_modelo`.
      operationId: crearEntrenamiento
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParametrosEntrenamiento"}
      security: [{bearerAuth: []}]
      responses:
        "202":
          description: Entrenamiento aceptado.
          headers:
            Location:
              schema: {type: string, example: /api/v1/entrenamientos/ent-20261117T183000-1}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entrenamiento"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/entrenamientos/{id}:
    get:
      tags: [cluster]
      summary: Estado de un entrenamiento
      operationId: verEntrenamiento
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, example: ent-20261117T183000-1}
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Estado del entrenamiento.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entrenamiento"}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/ws/ticket:
    post:
      tags: [cluster]
      summary: Ticket de un solo uso para abrir el WebSocket (30 s)
      description: |
        El navegador no puede enviar Authorization en el handshake del
        WebSocket: la SPA pide aquí un ticket (con su JWT de admin) y lo pasa
        en `GET /api/v1/ws?ticket=…`. Vale una vez y vence a los 30 s. Como
        máximo 128 tickets sin usar (luego 429).
      operationId: emitirTicket
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Ticket emitido.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expira]
                properties:
                  ticket: {type: string, description: "32 bytes aleatorios en base64url."}
                  expira: {type: integer, format: int64, description: "Vencimiento en segundos Unix."}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/v1/ws:
    get:
      tags: [cluster]
      summary: WebSocket con los eventos del entrenamiento en vivo
      description: |
        Handshake RFC 6455 (stdlib). Comprobaciones en orden: `Origin` fuera de
        `CORS_ORIGENES` → 403 (antes de tocar el ticket); ticket inexistente,
        vencido o usado → 401; ticket sin rol admin → 403. Conectado, recibe un
        mensaje de texto por evento del coordinador (`cluster.Evento` en JSON:
        registro, tarea, gradiente, epoca, reasignacion, descarte, abortado,
        fin) y, al publicarse un modelo entrenado, uno `modelo` de la API con la
        versión en `detalle` y los pesos finales en `pesos` (los de `epoca` son
        los usados en esa época, antes de actualizarlos). El servidor manda ping
        cada 20 s y cierra con 1001 al apagarse.
      operationId: servirWS
      security: [{ticketWS: []}]
      parameters:
        - name: ticket
          in: query
          required: true
          schema: {type: string}
      responses:
        "101": {description: Protocolo cambiado a WebSocket.}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/demo/nodos/{nombre}/cortar:
    post:
      tags: [cluster]
      summary: Corta la conexión de un nodo (solo con -demo)
      description: |
        Solo existe si el coordinador arrancó con `-demo` (sin el flag, 404).
        Cierra la conexión TCP del nodo como si se cortara el cable: el
        coordinador lo descarta y reasigna sus shards; el resultado sigue
        siendo igual bit a bit al secuencial. En modo demo,
        `POST /api/v1/entrenamientos` admite además `ritmo_ms` (pausa entre
        épocas, 0–2000).
      operationId: cortarNodo
      parameters:
        - name: nombre
          in: path
          required: true
          schema: {type: string, example: nodo-2}
      security: [{bearerAuth: []}]
      responses:
        "202":
          description: Conexión cortada; el descarte llega por el WebSocket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodo: {type: string}
                  estado: {type: string, enum: [cortado]}
        "401": {$ref: "#/components/responses/NoAutenticado"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    ticketWS:
      type: apiKey
      in: query
      name: ticket
      description: Ticket de un solo uso de POST /api/v1/ws/ticket (más Origin en CORS_ORIGENES).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de POST /api/v1/auth/login (HS256, 60 min). En Swagger UI, botón
        «Authorize» y pegar solo el token. Matriz de roles en ADR-0007.
  responses:
    NoAutenticado:
      description: Falta el token, no verifica o venció.
      headers:
        WWW-Authenticate:
          schema: {type: string, example: "Bearer realm=\"vigia\", error=\"invalid_token\""}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string, example: token inválido o vencido}
    SinPermiso:
      description: El rol del token no tiene acceso a esta ruta (p. ej., un analista en una ruta de admin).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string, example: tu rol no tiene acceso a este recurso}
    Error:
      description: Error con mensaje en español.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string, example: "semana epidemiológica 54 fuera de 1–53"}
  schemas:
    DocumentoEvaluacion:
      type: object
      description: Esquema completo en internal/evaluacion (Reporte); aquí, los campos comunes.
      required: [version_esquema, version_modelo]
      properties:
        version_esquema: {type: integer, enum: [1]}
        version_modelo: {type: string, example: e69395b36d2f}
        riesgo:
          type: object
          properties:
            min_casos: {type: integer}
            departamentos: {type: array, items: {type: string}}
            etapas: {type: array, items: {type: string}}
            celdas: {type: array, items: {$ref: "#/components/schemas/Celda"}}
        prioridades: {type: array, items: {$ref: "#/components/schemas/Celda"}}
      additionalProperties: true
    Celda:
      type: object
      properties:
        departamento: {type: string, example: PIURA, description: "TODOS = nivel nacional."}
        semana: {type: integer, minimum: 0, maximum: 52, description: "0 = todas."}
        etapa: {type: string, example: adulto_30_59, description: "todas = todos los grupos."}
        casos: {type: integer}
        con_signos_observados: {type: integer}
        tasa_observada: {type: number, format: double}
        riesgo_calibrado_medio: {type: number, format: double}
        casos_esperados: {type: number, format: double}
        fraccion_nacional: {type: number, format: double}
        razon_vs_nacional: {type: number, format: double}
        insuficiente: {type: boolean}
    Login:
      type: object
      additionalProperties: false
      required: [correo, clave]
      properties:
        correo: {type: string, maxLength: 254, example: analista@vigia.pe}
        clave: {type: string, format: password, maxLength: 256}
    Sesion:
      type: object
      required: [token, correo, rol, expira]
      properties:
        token: {type: string, description: "JWT HS256 para la cabecera Authorization: Bearer."}
        correo: {type: string, example: analista@vigia.pe}
        rol: {type: string, enum: [admin, analista]}
        expira: {type: integer, format: int64, description: "Vencimiento en segundos Unix."}
    Consulta:
      type: object
      additionalProperties: false
      required: [departamento, ano, semana, edad, sexo]
      properties:
        departamento: {type: string, example: LORETO, description: "Sin distinguir mayúsculas."}
        ano: {type: integer, minimum: 2011, maximum: 2100, example: 2024, description: "Mínimo: ano_min del modelo."}
        semana: {type: integer, minimum: 1, maximum: 53, example: 10}
        edad: {type: integer, minimum: 0, example: 34}
        tipo_edad: {type: string, enum: [A, M, D], default: A, description: "Años, meses o días."}
        sexo: {type: string, enum: [F, M]}
    Prediccion:
      type: object
      properties:
        riesgo: {type: number, format: double, description: "Probabilidad calibrada a la tasa real."}
        probabilidad_ponderada: {type: number, format: double, description: "σ(w·x+b) del modelo con pesos por clase; se compara con el umbral."}
        clase: {type: integer, enum: [0, 1]}
        etiqueta: {type: string, example: con signos de alarma o grave}
        umbral: {type: number, format: double, example: 0.5}
        departamento_modelo: {type: string, example: LORETO, description: "Columna usada (OTROS si no tiene propia)."}
        version_modelo: {type: string, example: 3f9a1c0b7d2e}
        logit: {type: number, format: double, description: "z = sesgo + Σ aportes; probabilidad_ponderada = σ(z)."}
        sesgo: {type: number, format: double}
        contribuciones:
          type: array
          description: "Una por variable, en el orden del modelo: sesgo + Σ aporte, sumados en ese orden, da logit exacto."
          items: {$ref: "#/components/schemas/Contribucion"}
    Contribucion:
      type: object
      properties:
        variable: {type: string, example: depto_piura}
        valor: {type: number, format: double, description: "Variable ya transformada (estandarizada o 0/1)."}
        peso: {type: number, format: double}
        aporte: {type: number, format: double, description: "peso × valor"}
    Modelo:
      type: object
      properties:
        version: {type: string}
        generado: {type: string, format: date-time}
        umbral: {type: number, format: double}
        ajuste_prior: {type: number, format: double}
        sesgo: {type: number, format: double}
        ano_min: {type: integer}
        departamentos:
          type: array
          items: {type: string}
        variables:
          type: array
          items:
            type: object
            properties:
              nombre: {type: string, example: depto_loreto}
              peso: {type: number, format: double}
    EstadoCluster:
      type: object
      properties:
        epocas: {type: integer, description: "Épocas completadas."}
        perdida: {type: number, format: double}
        reasignaciones: {type: integer}
        error: {type: string}
        nodos:
          type: array
          items: {$ref: "#/components/schemas/EstadoNodo"}
    EstadoNodo:
      type: object
      properties:
        nombre: {type: string}
        remoto: {type: string}
        workers: {type: integer}
        sano: {type: boolean}
        carga: {type: integer, description: "Shards asignados."}
        motivo: {type: string}
    ParametrosEntrenamiento:
      type: object
      additionalProperties: false
      properties:
        epocas: {type: integer, minimum: 1, maximum: 100000, default: 600}
        tasa: {type: number, format: double, default: 2}
        lambda: {type: number, format: double, default: 0.0001}
        ritmo_ms: {type: integer, minimum: 0, maximum: 2000, default: 0, description: "Pausa entre épocas; solo con -demo (sin él, 400)."}
    Entrenamiento:
      type: object
      properties:
        id: {type: string, example: ent-20261117T183000-1}
        estado: {type: string, enum: [en_curso, terminado, fallido]}
        epocas: {type: integer}
        tasa: {type: number, format: double}
        lambda: {type: number, format: double}
        epoca: {type: integer, description: "Épocas completadas."}
        perdida: {type: number, format: double}
        historia:
          type: array
          description: "Pérdida por época."
          items: {type: number, format: double}
        nodos:
          type: array
          description: "Nodos del clúster al terminar."
          items: {$ref: "#/components/schemas/EstadoNodo"}
        reasignaciones: {type: integer}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        version_modelo: {type: string}
        error: {type: string}
