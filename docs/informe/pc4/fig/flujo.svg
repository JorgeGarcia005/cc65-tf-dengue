<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="Arial, Helvetica, sans-serif">
<title>Diagrama de flujo del entrenamiento distribuido en el coordinador</title>
<defs>
  <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
  </marker>
</defs>
<rect width="820" height="640" fill="#ffffff"/>

<!-- Columna izquierda: bucle de entrenamiento -->
<text x="180" y="16" font-size="11" font-weight="bold" fill="#52514e" text-anchor="middle">Bucle de entrenamiento (ml.EntrenarFalible)</text>
<rect x="55" y="26" width="250" height="40" rx="20" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
<text x="180" y="43" font-size="12" font-weight="bold" text-anchor="middle">Inicio</text>
<text x="180" y="58" font-size="11" text-anchor="middle">esperar el registro de los N nodos</text>

<rect x="55" y="86" width="250" height="32" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="180" y="107" font-size="12" text-anchor="middle">w ← 0 · e ← 0</text>

<polygon points="180,138 260,168 180,198 100,168" fill="#fff6dd" stroke="#b07d00" stroke-width="1.5"/>
<text x="180" y="172" font-size="12" text-anchor="middle">¿e &lt; épocas?</text>

<rect x="55" y="218" width="250" height="50" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="180" y="237" font-size="12" font-weight="bold" text-anchor="middle">Difundir la época e</text>
<text x="180" y="255" font-size="11" text-anchor="middle">todos los shards pendientes · cubrir()</text>

<rect x="55" y="430" width="250" height="56" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
<text x="180" y="450" font-size="12" font-weight="bold" text-anchor="middle">Barrera cumplida</text>
<text x="180" y="466" font-size="11" text-anchor="middle">ReducirEnOrden(parciales[0..B−1])</text>
<text x="180" y="480" font-size="11" text-anchor="middle">→ Finalizar → ∇L(w)</text>

<rect x="55" y="506" width="250" height="44" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="180" y="524" font-size="12" font-weight="bold" text-anchor="middle">Actualizar</text>
<text x="180" y="541" font-size="11" text-anchor="middle">w ← w − η·∇L(w) · pérdida · e ← e + 1</text>

<rect x="55" y="580" width="250" height="44" rx="6" fill="#fbe3e0" stroke="#b3261e" stroke-width="1.5"/>
<text x="180" y="598" font-size="12" font-weight="bold" text-anchor="middle">Abortar</text>
<text x="180" y="614" font-size="11" text-anchor="middle">fin(abortado) a los nodos · error</text>

<!-- Fin -->
<rect x="440" y="140" width="360" height="56" rx="20" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
<text x="620" y="156" font-size="12" font-weight="bold" text-anchor="middle">Fin: devuelve w y la pérdida</text>
<text x="620" y="171" font-size="11" text-anchor="middle">modo único: reports/*.json y fin(completo) a los nodos</text>
<text x="620" y="186" font-size="11" text-anchor="middle">modo API: publica el modelo; los nodos siguen conectados</text>

<!-- Columna derecha: una época en el coordinador -->
<text x="600" y="222" font-size="11" font-weight="bold" fill="#52514e" text-anchor="middle">Una época en el coordinador (GradienteErr, Algoritmo 1)</text>
<polygon points="602,280 702,310 602,340 502,310" fill="#fff6dd" stroke="#b07d00" stroke-width="1.5"/>
<text x="602" y="306" font-size="11.5" text-anchor="middle">¿quedan shards</text>
<text x="602" y="320" font-size="11.5" text-anchor="middle">pendientes?</text>

<rect x="472" y="360" width="260" height="40" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="602" y="377" font-size="12" font-weight="bold" text-anchor="middle">Esperar</text>
<text x="602" y="392" font-size="11" text-anchor="middle">el siguiente evento o el plazo más cercano</text>

<g font-size="10.5" fill="#0b0b0b">
  <rect x="405" y="436" width="125" height="78" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="413" y="452" font-weight="bold">gradiente del dueño</text>
  <text x="413" y="466">de la época e: copia</text>
  <text x="413" y="480">sus parciales al slot</text>
  <text x="413" y="494">de su bloque global;</text>
  <text x="413" y="508">el shard queda listo</text>
  <rect x="540" y="436" width="125" height="78" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="548" y="452" font-weight="bold">nodo caído</text>
  <text x="548" y="466">(EOF o error de</text>
  <text x="548" y="480">lectura): descartarlo;</text>
  <text x="548" y="494">sus shards quedan</text>
  <text x="548" y="508">sin dueño</text>
  <rect x="675" y="436" width="125" height="78" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="683" y="452" font-weight="bold">plazo vencido</text>
  <text x="683" y="466">descartar solo a los</text>
  <text x="683" y="480">dueños de shards</text>
  <text x="683" y="494">cuyo propio plazo</text>
  <text x="683" y="508">venció (1.ª pasada)</text>
</g>

<rect x="405" y="540" width="395" height="56" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="602" y="558" font-size="12" font-weight="bold" text-anchor="middle">cubrir() · 2.ª pasada</text>
<text x="602" y="575" font-size="11" text-anchor="middle">cada shard sin dueño → nodo sano de menor carga</text>
<text x="602" y="586" font-size="10" fill="#52514e" text-anchor="middle">(empate: menor índice) · envía asignacion si hace falta, y epoca</text>

<!-- Flechas -->
<g stroke="#0b0b0b" stroke-width="1.5" fill="none">
  <line x1="180" y1="66" x2="180" y2="84" marker-end="url(#f)"/>
  <line x1="180" y1="118" x2="180" y2="136" marker-end="url(#f)"/>
  <line x1="180" y1="198" x2="180" y2="216" marker-end="url(#f)"/>
  <line x1="260" y1="168" x2="438" y2="168" marker-end="url(#f)"/>
  <polyline points="305,243 602,243 602,278" marker-end="url(#f)"/>
  <path d="M502,310 L338,310 A6,6 0 0 0 326,310 L180,310 L180,428" marker-end="url(#f)"/>
  <line x1="602" y1="340" x2="602" y2="358" marker-end="url(#f)"/>
  <polyline points="602,400 602,418 467,418 467,434" marker-end="url(#f)"/>
  <line x1="602" y1="418" x2="602" y2="434" marker-end="url(#f)"/>
  <polyline points="602,418 737,418 737,434" marker-end="url(#f)"/>
  <line x1="467" y1="514" x2="467" y2="538" marker-end="url(#f)"/>
  <line x1="602" y1="514" x2="602" y2="538" marker-end="url(#f)"/>
  <line x1="737" y1="514" x2="737" y2="538" marker-end="url(#f)"/>
  <polyline points="800,568 812,568 812,310 704,310" marker-end="url(#f)"/>
  <line x1="180" y1="486" x2="180" y2="504" marker-end="url(#f)"/>
  <polyline points="55,528 35,528 35,168 98,168" marker-end="url(#f)"/>
  <polyline points="403,575 332,575"/>
  <polyline points="305,258 332,258 332,602 307,602" marker-end="url(#f)"/>
</g>
<g font-size="11" fill="#0b0b0b" font-weight="bold">
  <text x="270" y="162">no</text>
  <text x="188" y="212">sí</text>
  <text x="474" y="304">no</text>
  <text x="608" y="354">sí</text>
</g>
<g font-size="10.5" fill="#52514e">
  <text x="190" y="304">todos los parciales llegaron</text>
  <text x="326" y="520" transform="rotate(-90 326 520)" text-anchor="middle">sin nodo sano (cualquier cubrir)</text>
  <text x="27" y="380" transform="rotate(-90 27 380)" text-anchor="middle">siguiente época</text>
  <text x="756" y="302" text-anchor="middle">repetir</text>
</g>
</svg>
