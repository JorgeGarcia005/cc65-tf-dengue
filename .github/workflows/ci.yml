name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentes:
    name: Ecosistema de agentes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Skills sincronizadas (.agents ↔ .claude)
        run: bash scripts/check-skills-sync.sh
      - name: AGENTS.md dentro del límite de Antigravity (12 000 caracteres)
        run: |
          n=$(wc -m < AGENTS.md)
          echo "AGENTS.md: $n caracteres"
          test "$n" -le 12000

  spin:
    name: Spin (modelo del protocolo y mutantes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Instalar Spin y gcc
        run: sudo apt-get update -q && sudo apt-get install -y -q spin gcc
      - name: Seguridad y LTL del modelo; contraejemplo en cada mutante
        run: bash spin/verificar.sh

  openapi:
    name: OpenAPI 3 válido
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar docs/api/openapi.yaml
        run: npx --yes @redocly/cli@1.25.0 lint --extends=minimal docs/api/openapi.yaml

  bd:
    name: MongoDB y Redis (tests de integración)
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0.14
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race -tags integracion (adaptadores y API de punta a punta)
        run: go test -race -count=1 -tags integracion -v ./internal/almacen/... ./internal/api

  go:
    name: Go (gofmt, vet, test -race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ¿Hay código Go?
        id: hay
        run: |
          if [ -f go.mod ] && [ -n "$(find . -name '*.go' -not -path './web/*' | head -1)" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Sin código Go todavía; se omite."
          fi
      - uses: actions/setup-go@v5
        if: steps.hay.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: steps.hay.outputs.go == 'true'
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './web/*'))
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        if: steps.hay.outputs.go == 'true'
        run: go vet ./...
      - name: go test -race
        if: steps.hay.outputs.go == 'true'
        run: go test -race -count=1 ./...

  docker:
    name: Docker (imagen, clúster y caída de un nodo)
    runs-on: ubuntu-24.04
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Imagen única, sin privilegios y menor de 40 MB
        run: |
          docker build -f deploy/Dockerfile -t cc65-tf .
          docker image inspect cc65-tf --format 'usuario={{.Config.User}} bytes={{.Size}}'
          test "$(docker image inspect cc65-tf --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect cc65-tf --format '{{.Size}}')" -lt 40000000
      - name: Gold sintético con 3 shards (el CSV del MINSA no se versiona)
        run: go run ./cmd/gold -sintetico 400000 -shards 3 -salida "$RUNNER_TEMP/gold"
      - name: Entrenamiento en el clúster (coordinador + 3 nodos) igual al secuencial
        env:
          EPOCAS: "60"
          VERIFICAR: "true"
        run: |
          export GOLD="$RUNNER_TEMP/gold" USUARIO="$(id -u):$(id -g)"
          mkdir -p reports
          docker compose -f deploy/docker-compose.yml up --exit-code-from coordinator
          python3 -c "import json; r = json.load(open('reports/entrenamiento_cluster.json')); assert r['igual_al_secuencial'] is True and r['epocas'] == 60 and len(r['cluster']['nodos']) == 3, r['cluster']; print('nodos:', [n['nombre'] for n in r['cluster']['nodos']], '· ms/época:', round(1000 * r['seg_por_epoca'], 1))"
          docker compose -f deploy/docker-compose.yml down
      - name: Caída de un nodo a mitad del entrenamiento
        env:
          EPOCAS: "1000"
          MATAR_EN: "20"
        run: |
          export GOLD="$RUNNER_TEMP/gold" USUARIO="$(id -u):$(id -g)"
          bash scripts/prueba-caida.sh
          python3 -c "import json; r = json.load(open('reports/entrenamiento_cluster.json')); c = r['cluster']; assert r['igual_al_secuencial'] is True and c['reasignaciones'] >= 1 and sum(not n['sano'] for n in c['nodos']) >= 1, c; print('reasignaciones:', c['reasignaciones'])"
